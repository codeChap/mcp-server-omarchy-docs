name: Refresh knowledge base

# Weekly snapshot of the Omarchy KB, attached to an auto-updating release.
# Users can download kb.sqlite3 directly instead of running the pipeline.

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rs

      - name: Build binaries
        working-directory: server-rs
        run: cargo build --release

      - name: Fetch sources
        run: ./scripts/fetch_sources.sh

      - name: Build KB
        run: server-rs/target/release/build-kb "$PWD"

      - name: Test
        working-directory: server-rs
        run: cargo test --release

      - name: Stamp snapshot info
        id: meta
        run: |
          LATEST=$(curl -fsSL -H 'User-Agent: mcp-server-omarchy-docs' \
            'https://api.github.com/repos/basecamp/omarchy/releases?per_page=1' | jq -r '.[0].tag_name')
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Publish to 'kb' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kb
          name: "Knowledge base snapshots"
          body: |
            Prebuilt `data/kb.sqlite3` snapshots. Download and drop into `data/`
            next to the server — no fetch/build needed.

            Snapshot: ${{ steps.meta.outputs.tag }}, built ${{ github.event_name == 'schedule' && 'weekly (scheduled)' || 'on demand' }} from the pinned upstream commit.
          files: data/kb.sqlite3
          make_latest: false
